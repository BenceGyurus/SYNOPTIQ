global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: solaris
    scheme: https
    metrics_path: /api/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/solaris.token
    static_configs:
      # Replace with the host:port of the existing Solaris frontend.
      - targets: ["solaris.example.com:443"]
