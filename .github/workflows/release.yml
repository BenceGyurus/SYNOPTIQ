name: Verify and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Production dependencies gate releases; also block critical build-tool findings.
      # The currently unpatched braces advisory is confined to ESLint's glob tools.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=critical
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          BETTER_AUTH_SECRET: ci-only-secret-for-build-not-production
          BETTER_AUTH_URL: http://localhost:3000

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solaris_test
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: solaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solaris_test -d solaris_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://solaris_test:ci-only-database-password@localhost:5432/solaris_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install pip-audit==2.10.1 && pip-audit -r backend/requirements.lock --progress-spinner off
      - run: python -m compileall -q backend/app backend/main.py
      - run: python -m unittest discover -s backend/tests -v
      - name: Validate generated dashboards and exporter metric references
        run: |
          python monitoring/generate_dashboards.py --check
          python monitoring/validate.py --fixture "$RUNNER_TEMP/solaris-metrics.prom" --rules "$RUNNER_TEMP/solaris-dashboard-rules.json"
      - name: Validate Prometheus format, configuration and dashboard PromQL
        run: |
          docker run --rm -i --entrypoint /bin/promtool prom/prometheus:v3.15.0 check metrics < "$RUNNER_TEMP/solaris-metrics.prom"
          docker run --rm -v "$RUNNER_TEMP:/work:ro" --entrypoint /bin/promtool prom/prometheus:v3.15.0 check rules /work/solaris-dashboard-rules.json
          docker run --rm -v "$PWD/monitoring:/work:ro" --entrypoint /bin/promtool prom/prometheus:v3.15.0 check config --syntax-only /work/prometheus.example.yml
      - name: Import both dashboards into Grafana
        env:
          GRAFANA_TEST_PASSWORD: ci-only-grafana-password
        run: |
          docker run --detach --name solaris-grafana-ci --publish 127.0.0.1:3100:3000 \
            --env GF_SECURITY_ADMIN_USER=ci --env "GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_TEST_PASSWORD" \
            --env GF_ANALYTICS_REPORTING_ENABLED=false --env GF_ANALYTICS_CHECK_FOR_UPDATES=false \
            --env GF_PLUGINS_PREINSTALL_DISABLED=true grafana/grafana:13.2.4
          python monitoring/validate.py --grafana http://127.0.0.1:3100
      - name: Grafana diagnostics on failure
        if: failure()
        run: docker logs --tail 100 solaris-grafana-ci || true
      - name: Remove test Grafana container
        if: always()
        run: docker rm --force solaris-grafana-ci || true

  images:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        id: namespace
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/solaris-backend:sha-${{ github.sha }}-${{ matrix.suffix }}
          provenance: true
          sbom: true
      - name: Build and publish frontend (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ steps.namespace.outputs.owner }}/solaris-frontend:sha-${{ github.sha }}-${{ matrix.suffix }}
          provenance: true
          sbom: true

  publish-manifest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        id: namespace
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publish multi-platform tags
        shell: bash
        run: |
          set -euo pipefail
          for name in backend frontend; do
            image="ghcr.io/${{ steps.namespace.outputs.owner }}/solaris-${name}"
            docker buildx imagetools create \
              --tag "${image}:sha-${GITHUB_SHA}" \
              --tag "${image}:latest" \
              "${image}:sha-${GITHUB_SHA}-amd64" \
              "${image}:sha-${GITHUB_SHA}-arm64"
            docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}"
          done
